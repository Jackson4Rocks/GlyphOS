LABEL glyphos
TEXT HELP
Boot the GlyphOS live environment.
ENDTEXT
MENU LABEL GlyphOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL glyphos-safe
TEXT HELP
Boot GlyphOS with nomodeset for troubleshooting display hardware.
ENDTEXT
MENU LABEL GlyphOS Live (%ARCH%, BIOS) - Safe Graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
