name: Build GlyphOS ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build x86_64 ISO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO in privileged Arch container
        run: |
          docker run --rm --privileged             -v "${GITHUB_WORKSPACE}:/workspace"             -w /workspace             archlinux:latest             bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm archiso git grub syslinux
              bash scripts/validate-profile.sh
              mkdir -p work out
              mkarchiso -v -w work -o out profile
            '

      - name: Show ISO
        run: |
          ls -lh out/*.iso
          sha256sum out/*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: glyphos-x86_64-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
