[package]
name = "glyphwm"
version.workspace = true
edition.workspace = true
description = "GlyphOS custom Wayland compositor (Smithay-based) — phase 3 target, feature-gated"

# Building this crate is cheap by default: `run` pulls in Smithay and the
# compositor implementation. DO NOT ship a fake without it — see src/main.rs.

[features]
default = []
run = ["dep:smithay"]

# Smithay remains optional so geometry tests do not require a compositor runtime.
[dependencies]
glyph-core = { path = "../../crates/glyph-core" }
# Nested development backend first: iterate inside an existing session, then
# swap winit for the udev/libinput seat once the core window logic is real.
smithay = { workspace = true, optional = true }
