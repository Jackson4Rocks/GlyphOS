# GlyphOS · development compositor fallback (Hyprland)

# Do NOT brand this as the finished GlyphOS session. It exists so the shell
# can be developed today; glyphwm (crates/compositor/plan) replaces it later.

# Map GlyphOS bindings to glyphctl over the IPC bus:
$launchctl = glyphctl

bind = SUPER, space, exec, glyphctl command
bind = SUPER, c, exec, glyphctl control
bind = SUPER, n, exec, glyphctl notify
bind = SUPER+SHIFT, Return, exec, glyphctl launch kitty
bind = SUPER+SHIFT, E, exec, glyphctl launch glyphos-files
bind = SUPER, 1, exec, glyphctl workspace 1
bind = SUPER, 2, exec, glyphctl workspace 2
bind = SUPER, 3, exec, glyphctl workspace 3
bind = SUPER, 4, exec, glyphctl workspace 4

# Layer-shell must stay enabled (default). Disable for tests only:
misc:disable_hyprland_qt_utils_warning = true
