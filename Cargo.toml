[workspace]
resolver = "2"
members = [
    "crates/glyph-core",
    "crates/glyph-system",
    "crates/glyph-shell",
    "crates/glyphctl",
    "compositor/glyphwm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/glyphos/glyphos"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
gdk = { package = "gdk4", version = "0.11" }
gtk4-layer-shell = "0.8"
### glyphwm phase 3 target — left optional; enable with `--features run`
# smithay = { version = "0.6", default-features = false, features = ["backend_libinput", "backend_udev", "renderer_gles2"] }

[profile.release]
lto = "thin"
codegen-units = 4
